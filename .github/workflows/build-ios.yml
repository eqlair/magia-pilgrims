name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync iOS Project
        run: npx cap sync ios

      - name: Build iOS App (.app)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into .ipa
        run: |
          APP_PATH=$(find ios/App -name "App.app" -type d | head -n 1)
          echo "Found App.app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r magia_pilgrims.ipa Payload
          ls -la magia_pilgrims.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: magia_pilgrims_ios_ipa
          path: magia_pilgrims.ipa
          retention-days: 14
